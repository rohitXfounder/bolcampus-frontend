<!DOCTYPE html>
<html lang="en">
<head>
    <title>BOLCAMPUS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="College complaint management system for students">
    <link rel="stylesheet" href="style.css">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <!-- ✅ FIX 1: Theme Toggle moved to top and stripped of conflicting inline styles -->
    <button id="themeToggle">🌓</button>

    <!-- ✅ FIX 2: Added a wrapper for the title to prevent it from hiding under the toggle on mobile -->
    <header class="main-header">
        <h1>BOLCAMPUS <span>(Student Portal)</span></h1>
    </header>

    <div class="container">
        <!-- REGISTER COMPLAINT -->
        <h2>Suggestion Box</h2>
        <form id="complaintForm" enctype="multipart/form-data">
            <input type="text" id="name" placeholder="Enter Name" required>

            <select id="branch">
                <option value="" disabled selected>Select Branch</option>
                <option>AI&DS</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EE</option>
                <option>ACT</option>
                <option>VLSI</option>
                <option>CIVIL</option>
                <option>MECHANICAL</option>
            </select>

            <input type="text" id="division" placeholder="Division" required>
            <input type="text" id="roll" placeholder="Roll Number" required>

            <select id="issue">
                <option value="" disabled selected>Select Issue Type</option>
                <option>Collage water</option>
                <option>Hostel Water</option>
                <option>College Toilet</option>
                <option>Hostel Toilet</option>
                <option>College Electricity</option>
                <option>Hostel Electricity</option>
                <option>Academics</option>
                <option>Administration</option>
            </select>

            <textarea id="description" placeholder="Describe your complaint"></textarea>
            
            <!-- ✅ FIX 3: Styled File Input Label (Modern UI) -->
            <div class="file-input-wrapper">
                <label for="image">Upload Image (Optional)</label>
                <input type="file" id="image" accept="image/*">
            </div>

            <button type="submit" id="submitBtn">Submit Suggestion</button>
        </form>

        <div id="uniqueIdDisplay"></div>
        
        <button id="copyBtn" onclick="copyID()">📋 Copy ID</button>

        <hr class="divider">

        <!-- TRACK SUGGESTION -->
        <h2>Track Suggestion</h2>
        <div class="track-section">
            <input type="text" id="trackId" placeholder="Enter Suggestion ID">
            <button id="trackBtn" onclick="trackComplaint()">Track</button>
            <div id="statusDisplay"></div>
        </div>

        <hr class="divider">
        
        <!-- ADMIN ACCESS -->
        <div class="admin-link-section">
            <h3>Staff Only</h3>
            <button onclick="openAdmin()" class="admin-btn">Admin Login</button>
        </div>
    </div>

    <!-- POPUP / MODAL -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <span onclick="closePopup()" class="close-btn">&times;</span>
            <div id="popupDetails"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <div id="toastContainer"></div>
</body>
</html>
